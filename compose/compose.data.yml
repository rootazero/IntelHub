# compose.data.yml — Tier 1 core infrastructure (spec §4)
# All services: data-net ONLY (internal, no internet), no published ports except
# neo4j 7474/7687 bound to LAN IP (temporary, closes in SP3).

x-restart-policy: &restart-policy
  restart: unless-stopped

x-security: &security
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: intelhub-postgres
    <<: [*restart-policy, *security]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../config/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data-net]
    mem_limit: 1536m
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  redis:
    image: redis:${REDIS_VERSION}
    container_name: intelhub-redis
    <<: [*restart-policy, *security]
    command:
      - sh
      - -c
      - |
        redis-server \
          --appendonly yes \
          --maxmemory 256mb \
          --maxmemory-policy allkeys-lru \
          --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks: [data-net]
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  neo4j:
    image: neo4j:${NEO4J_VERSION}
    container_name: intelhub-neo4j
    <<: [*restart-policy, *security]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: 1200m
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs
      - ../backups:/backups
    networks: [data-net]
    ports:
      - "${LAN_IP}:7474:7474"
      - "${LAN_IP}:7687:7687"
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      # NOTE: password is compose-interpolated into the healthcheck below.
      # Do NOT add NEO4J_PASSWORD as an env var — neo4j parses every NEO4J_*
      # var as a config setting and strict validation fails on unknown keys.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD}' 'RETURN 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION}
    container_name: intelhub-qdrant
    <<: [*restart-policy, *security]
    volumes:
      - qdrantdata:/qdrant/storage
      - ../backups/qdrant-snapshots:/qdrant/snapshots
    networks: [data-net]
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
